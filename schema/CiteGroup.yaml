$schema: "http://json-schema.org/draft-07/schema#"
$id: CiteGroup
title: CiteGroup
description: An inline container that groups citations with shared display semantics.
type: object
properties:
  type:
    description: The type discriminator for CiteGroup nodes.
    enum: [CiteGroup]
  id:
    description: A unique identifier for the node.
    type: string
  classes:
    description: A list of class names for styling or semantics.
    type: array
    items:
      type: string
  data:
    description: Arbitrary key-value data attached to the node.
    type: object
    additionalProperties: true
  kind:
    description: The citation display style shared by the group.
    enum: [narrative, parenthetical]
  children:
    description: The citations in the group.
    type: array
    items:
      $ref: "./Cite.yaml"
    minItems: 1
required:
  - type
  - kind
  - children
